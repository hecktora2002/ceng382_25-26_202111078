<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avatar Login</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Saatin sayfanın üst kısmında ortalanması için stil */
        /* "Saatin orta üste ve avatar fontuna uygun bir şekilde uyarla" promptu verildiğinde */
        .clock {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'IM Fell English SC', serif;
            font-size: 28px;
            color: #FFD700;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 20px;
            border-radius: 5px;
            box-shadow: 0px 0px 10px rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body>
    <!-- Canlı saat göstergesi -->
    <div class="clock" id="clock"></div>

    <div class="login-container" id="loginBox">
        <h2>Ancient Login</h2>
        <input type="text" id="username" placeholder="Enter Name" class="form-element"> 
        <input type="password" id="password" placeholder="Secret Code" class="form-element"> 
        <button onclick="storeLogin()">Login</button>
        
        <div class="elements-container">
            <div class="element fire">🔥</div>
            <div class="element water">💧</div>
            <div class="element earth">🌿</div>
            <div class="element air">🌪️</div>
        </div>
    </div>
    
    <div class="avatar-container" onclick="toggleLogin()">
        <div class="avatar">
            <div class="head">
                <div class="head-shadow"></div>
                <div class="arrow"></div>
                <div class="arrow-point"></div>
                <div class="eyebrow eyebrow-left"></div>
                <div class="eyebrow eyebrow-right"></div>
                <div class="ear ear-left"></div>
                <div class="ear ear-right"></div>
                <div class="eyes"></div>
                <div class="eyes eye-right"></div>
            </div>
        </div>
    </div>

    <script>
        let loginAttempts = [];

        /* Login kutusunun açılıp kapanmasını sağlayan fonksiyon */
        /* "H tuşuna bastığımızda kapandığı gibi yeniden bastığımızda ise açılsın" promptu verildiğinde */
        function toggleLogin() {
            const loginBox = document.getElementById("loginBox");
            if (loginBox.style.display === "none" || loginBox.style.display === "") {
                loginBox.style.display = "block";
                setTimeout(() => {
                    loginBox.style.opacity = "1";
                    loginBox.style.transform = "translate(-50%, -50%) translateY(0)";
                }, 10);
            } else {
                loginBox.style.opacity = "0";
                loginBox.style.transform = "translate(-50%, -50%) translateY(50px)";
                setTimeout(() => {
                    loginBox.style.display = "none";
                }, 500);
            }
        }

        /* Gerçek zamanlı saat güncelleme fonksiyonu */
        function updateClock() {
            const clockElement = document.getElementById("clock");
            const now = new Date();
            const hours = now.getHours().toString().padStart(2, '0');
            const minutes = now.getMinutes().toString().padStart(2, '0');
            const seconds = now.getSeconds().toString().padStart(2, '0');
            clockElement.textContent = `${hours}:${minutes}:${seconds}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        /* H tuşuna basıldığında login ekranını aç/kapat, ancak input alanına odaklanılmışsa çalışmasın */
        document.addEventListener("keydown", function(event) {
            if (event.key.toLowerCase() === 'h') {
                if (document.activeElement.tagName.toLowerCase() === 'input') {
                    return;
                }
                toggleLogin();
            }
        });

        /* Şifrede büyük harf olup olmadığını kontrol eden fonksiyon */
        /* "Consolda şifreyi görürken harflerin büyük olup olmadığını da anlasın" promptu verildiğinde */
        function analyzePassword(password) {
            const hasUpperCase = /[A-Z]/.test(password);
            return hasUpperCase ? "Contains uppercase letters" : "No uppercase letters";
        }

        /* Kullanıcı giriş bilgilerini diziye kaydeden ve konsola yazdıran fonksiyon */
        /* "Kullanıcı adı ve şifre girilirken login butonuna basıldığında verileri sakla ve konsola yazdır" promptu verildiğinde */
        function storeLogin() {
            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;
            const passwordAnalysis = analyzePassword(password);
            
            loginAttempts.push({ username, password, passwordAnalysis });
            console.log("Login Attempts:", loginAttempts);
        }
    </script>

<script>
    function storeLogin() {
        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;

        if (username === "admin" && password === "admin") {
            window.location.href = "table.html"; // Başarılı girişte yönlendirme
        } else {
            alert("Invalid credentials!"); // Yanlış giriş uyarısı
        }
    }
</script>

</body>
</html>
