<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Portal</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* Login ekranını başlangıçta gizle */
        #login-screen {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 10px;
            opacity: 0; 
            visibility: hidden;
            transition: opacity 0.3s ease-in-out, visibility 0.3s ease-in-out;
        }

        /* Açık olduğunda görünür hale getir */
        #login-screen.active {
            opacity: 1;
            visibility: visible;
        }
    </style>
</head>
<body class="home">

    <div class="container top-left">
        <a href="#" id="login-button">
            <img src="Air_symbol.webp" alt="Go to Login" class="image-button">
        </a>
    </div>

    <div id="clock"></div>

    <div id="login-screen">
        <div class="login-box">
            <h2>Login</h2>
            <input type="text" placeholder="Kullanıcı Adı">
            <input type="password" placeholder="Şifre">
            <button class="button-brown">Giriş Yap</button>
        </div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('clock').textContent = `${hours}:${minutes}:${seconds}`;
        }

        updateClock();
        setInterval(updateClock, 1000);

        // "H" tuşuna basınca login ekranını aç/kapat
        document.addEventListener("keydown", function(event) {
            if (event.key.toLowerCase() === "h") {
                const loginScreen = document.getElementById("login-screen");
                loginScreen.classList.toggle("active");  // Aç/Kapa
            }
        });
    </script>

</body>
</html>
